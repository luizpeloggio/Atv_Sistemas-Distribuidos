<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa8ff"/></marker>
    <marker id="setaRosa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker>
    <marker id="setaCinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#131a38"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="22" fill="url(#fundo)"/>
  <text x="40" y="52" fill="#fff" font-size="23" font-weight="700">Arquitetura — TaskFlow Cloud (microsserviços)</text>
  <text x="40" y="76" fill="#9aa2c3" font-size="13.5">Cada serviço tem código, deploy e schema de banco próprios; a comunicação é por HTTP/REST.</text>

  <!-- navegador -->
  <rect x="40" y="285" width="150" height="90" rx="14" fill="#161d3f" stroke="#475085" stroke-width="2"/>
  <text x="115" y="325" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Navegador</text>
  <text x="115" y="347" fill="#9aa2c3" font-size="12.5" text-anchor="middle">Painel web (Kanban)</text>
  <line x1="190" y1="330" x2="298" y2="330" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="244" y="318" fill="#c7cdf5" font-size="12" text-anchor="middle">HTTPS</text>
  <text x="244" y="352" fill="#9aa2c3" font-size="11.5" text-anchor="middle">/api/*</text>

  <!-- gateway -->
  <rect x="300" y="225" width="240" height="210" rx="16" fill="#1a2147" stroke="#7c83ff" stroke-width="2.5"/>
  <text x="420" y="258" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">API Gateway</text>
  <text x="420" y="278" fill="#aab2e8" font-size="12.5" text-anchor="middle">FastAPI · porta 8000 · serve o painel</text>
  <line x1="320" y1="293" x2="520" y2="293" stroke="#323a6e"/>
  <text x="320" y="318" fill="#d6dbff" font-size="12.5">/api/usuarios  →  usuários</text>
  <text x="320" y="340" fill="#d6dbff" font-size="12.5">/api/projetos  →  projetos</text>
  <text x="320" y="362" fill="#d6dbff" font-size="12.5">/api/tarefas   →  tarefas</text>
  <text x="320" y="392" fill="#9aa2c3" font-size="12">/api/status · /api/resumo · /api/demo</text>
  <text x="320" y="412" fill="#9aa2c3" font-size="12">X-Request-ID em todas as chamadas</text>

  <!-- gateway -> servicos -->
  <path d="M540 285 C610 285 610 135 678 135" fill="none" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="540" y1="330" x2="678" y2="330" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <path d="M540 375 C610 375 610 525 678 525" fill="none" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- usuarios -->
  <rect x="680" y="70" width="240" height="130" rx="16" fill="#10281f" stroke="#34d399" stroke-width="2.5"/>
  <text x="800" y="102" fill="#fff" font-size="16.5" font-weight="700" text-anchor="middle">Serviço de Usuários</text>
  <text x="800" y="122" fill="#86efc4" font-size="12.5" text-anchor="middle">FastAPI · porta 8001</text>
  <text x="800" y="150" fill="#cdeee0" font-size="12.5" text-anchor="middle">CRUD de usuários (responsáveis)</text>
  <text x="800" y="170" fill="#9ccbb7" font-size="12" text-anchor="middle">GET /health</text>

  <!-- tarefas -->
  <rect x="680" y="265" width="240" height="130" rx="16" fill="#2b2110" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="800" y="297" fill="#fff" font-size="16.5" font-weight="700" text-anchor="middle">Serviço de Tarefas</text>
  <text x="800" y="317" fill="#fcd28a" font-size="12.5" text-anchor="middle">FastAPI · porta 8003 · entidade central</text>
  <text x="800" y="345" fill="#f3e0bd" font-size="12.5" text-anchor="middle">CRUD de tarefas + estatísticas</text>
  <text x="800" y="365" fill="#d7bf90" font-size="12" text-anchor="middle">timeout · erro 503 amigável</text>
  <text x="800" y="383" fill="#d7bf90" font-size="12" text-anchor="middle">modo degradado (listas continuam)</text>

  <!-- projetos -->
  <rect x="680" y="460" width="240" height="130" rx="16" fill="#0f2730" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="800" y="492" fill="#fff" font-size="16.5" font-weight="700" text-anchor="middle">Serviço de Projetos</text>
  <text x="800" y="512" fill="#7ce6f7" font-size="12.5" text-anchor="middle">FastAPI · porta 8002</text>
  <text x="800" y="540" fill="#c8eef5" font-size="12.5" text-anchor="middle">CRUD de projetos</text>
  <text x="800" y="560" fill="#94c5cf" font-size="12" text-anchor="middle">GET /health</text>

  <!-- tarefas -> usuarios / projetos -->
  <line x1="800" y1="265" x2="800" y2="202" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#setaRosa)"/>
  <text x="812" y="238" fill="#f9a8d4" font-size="12">GET /usuarios/{id}</text>
  <line x1="800" y1="395" x2="800" y2="458" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#setaRosa)"/>
  <text x="812" y="432" fill="#f9a8d4" font-size="12">GET /projetos/{id}</text>

  <!-- banco -->
  <rect x="990" y="50" width="170" height="530" rx="18" fill="#141a33" stroke="#64748b" stroke-width="2" stroke-dasharray="3 0"/>
  <text x="1075" y="76" fill="#fff" font-size="15.5" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="1075" y="94" fill="#94a3b8" font-size="12" text-anchor="middle">1 instância · 3 schemas</text>
  <rect x="1005" y="106" width="140" height="64" rx="12" fill="#10281f" stroke="#34d399"/>
  <text x="1075" y="134" fill="#d6f5e8" font-size="13" font-weight="600" text-anchor="middle">schema</text><text x="1075" y="154" fill="#86efc4" font-size="14" font-weight="700" text-anchor="middle">usuarios</text>
  <rect x="1005" y="295" width="140" height="70" rx="12" fill="#2b2110" stroke="#f59e0b"/>
  <text x="1075" y="325" fill="#fbe7c2" font-size="13" font-weight="600" text-anchor="middle">schema</text><text x="1075" y="345" fill="#fcd28a" font-size="14" font-weight="700" text-anchor="middle">tarefas</text>
  <rect x="1005" y="490" width="140" height="70" rx="12" fill="#0f2730" stroke="#22d3ee"/>
  <text x="1075" y="520" fill="#d3f3fa" font-size="13" font-weight="600" text-anchor="middle">schema</text><text x="1075" y="540" fill="#7ce6f7" font-size="14" font-weight="700" text-anchor="middle">projetos</text>
  <line x1="920" y1="135" x2="1003" y2="135" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setaCinza)"/>
  <line x1="920" y1="330" x2="1003" y2="330" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setaCinza)"/>
  <line x1="920" y1="525" x2="1003" y2="525" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setaCinza)"/>

  <!-- legenda -->
  <line x1="40" y1="625" x2="84" y2="625" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="94" y="630" fill="#c7cdf5" font-size="12.5">HTTP/REST (navegador → gateway → serviços)</text>
  <line x1="420" y1="625" x2="464" y2="625" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#setaRosa)"/>
  <text x="474" y="630" fill="#f9a8d4" font-size="12.5">HTTP síncrono entre serviços</text>
  <line x1="730" y1="625" x2="774" y2="625" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setaCinza)"/>
  <text x="784" y="630" fill="#cbd5e1" font-size="12.5">SQL (cada serviço só acessa o seu schema)</text>
  <text x="40" y="660" fill="#7f87ad" font-size="12">Deploy: 4 Web Services independentes no Render (render.yaml) + 1 banco PostgreSQL gerenciado.</text>
</svg>
