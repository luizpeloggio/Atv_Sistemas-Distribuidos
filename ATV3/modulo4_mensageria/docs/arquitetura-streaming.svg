<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa8ff"/></marker>
    <marker id="setaLar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#131a38"/></linearGradient>
  </defs>
  <rect width="1200" height="470" rx="22" fill="url(#fundo)"/>
  <text x="40" y="52" fill="#fff" font-size="23" font-weight="700">Proposta com streaming — produtor → log de eventos → consumidores</text>
  <text x="40" y="76" fill="#9aa2c3" font-size="13.5">Mesmo cenário (tarefa concluída) em Kafka/Redpanda: o evento fica gravado no log e vários consumidores o leem, no seu ritmo.</text>

  <rect x="40" y="170" width="250" height="130" rx="18" fill="#2b2110" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="165" y="205" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="2">PRODUTOR</text>
  <text x="165" y="238" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">serviço de tarefas</text>
  <text x="165" y="266" fill="#f3e0bd" font-size="13" text-anchor="middle">key = id da tarefa</text>

  <rect x="400" y="110" width="400" height="250" rx="18" fill="#1a2147" stroke="#7c83ff" stroke-width="2.5"/>
  <text x="600" y="143" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="2">BROKER (LOG)</text>
  <text x="600" y="170" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Kafka / Redpanda</text>
  <text x="600" y="192" fill="#aab2e8" font-size="12.5" text-anchor="middle">tópico  tarefas.eventos</text>
  <g font-size="11" text-anchor="middle" fill="#cdeee0">
    <text x="425" y="226" text-anchor="start" fill="#86efc4">partição 0</text>
    <text x="425" y="270" text-anchor="start" fill="#86efc4">partição 1</text>
    <text x="425" y="314" text-anchor="start" fill="#86efc4">partição 2</text>
  </g>
  <g fill="#10281f" stroke="#34d399">
    <rect x="505" y="208" width="42" height="26" rx="5"/><rect x="553" y="208" width="42" height="26" rx="5"/><rect x="601" y="208" width="42" height="26" rx="5"/><rect x="649" y="208" width="42" height="26" rx="5"/>
    <rect x="505" y="252" width="42" height="26" rx="5"/><rect x="553" y="252" width="42" height="26" rx="5"/><rect x="601" y="252" width="42" height="26" rx="5"/>
    <rect x="505" y="296" width="42" height="26" rx="5"/><rect x="553" y="296" width="42" height="26" rx="5"/><rect x="601" y="296" width="42" height="26" rx="5"/><rect x="649" y="296" width="42" height="26" rx="5"/><rect x="697" y="296" width="42" height="26" rx="5"/>
  </g>
  <text x="600" y="339" fill="#9aa2c3" font-size="11.5" text-anchor="middle">eventos ficam retidos (dias/semanas)</text>
  <text x="600" y="354" fill="#9aa2c3" font-size="11.5" text-anchor="middle">e cada consumidor guarda o seu "offset"</text>

  <rect x="900" y="110" width="260" height="68" rx="14" fill="#0f2730" stroke="#22d3ee" stroke-width="2.2"/>
  <text x="1030" y="139" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">grupo: notificações</text>
  <text x="1030" y="160" fill="#c8eef5" font-size="12" text-anchor="middle">registra e avisa (o consumidor atual)</text>
  <rect x="900" y="196" width="260" height="68" rx="14" fill="#0f2730" stroke="#22d3ee" stroke-width="2.2"/>
  <text x="1030" y="225" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">grupo: métricas</text>
  <text x="1030" y="246" fill="#c8eef5" font-size="12" text-anchor="middle">vazão e tempo até concluir (tempo real)</text>
  <rect x="900" y="282" width="260" height="68" rx="14" fill="#0f2730" stroke="#22d3ee" stroke-width="2.2"/>
  <text x="1030" y="311" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">grupo: analytics / auditoria</text>
  <text x="1030" y="332" fill="#c8eef5" font-size="12" text-anchor="middle">relê o histórico desde o início (replay)</text>

  <line x1="290" y1="235" x2="398" y2="235" stroke="#fb923c" stroke-width="3" marker-end="url(#setaLar)"/>
  <text x="344" y="222" fill="#fdba74" font-size="12" text-anchor="middle">append</text>
  <line x1="800" y1="170" x2="898" y2="144" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="800" y1="235" x2="898" y2="230" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="800" y1="300" x2="898" y2="316" stroke="#9aa8ff" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="849" y="400" fill="#c7cdf5" font-size="12" text-anchor="middle">cada grupo lê TODOS os eventos, de forma independente</text>
</svg>
